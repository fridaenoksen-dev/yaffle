<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaffle</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Redaksjonell stil: varm offwhite bakgrunn, serif-titler, én dyp grønn aksent. Ett skog-til-sand-felt per side. */
  --canvas:#f6f6f2;
  --paper:#ffffff;
  --fog:#f0f0f2;
  --fog-2:#e2e2e6;
  --accent:#1e5a46;
  --accent-ink:#164536;
  --mist:#e3efe9;
  --lime:#1e5a46;
  --forest:#000000;
  --spruce:#000000;
  --ink:#000000;
  --text:#3e3e3e;
  --muted:#636363;
  --faint:#9a9a9f;
  --line:rgba(0,0,0,.08);
  --red:#d92d3a;
  --red-soft:#fde8ea;
  --amber:#8a5a00;
  --amber-soft:#fbf0dc;
  --blue:#164536;
  --blue-soft:#e3efe9;
  --on-forest:#ffffff;
  --dusk:linear-gradient(180deg,#0f3b30 0%,#1e5a46 35%,#5f8f6e 70%,#c9b98a 100%);
  --glow:0 0 0 1px rgba(0,0,0,.05),0 0 0 5px #f6f6f2;
  --display:'DM Serif Display',Georgia,'Times New Roman',serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  --r-card:22px; --r-input:14px; --r-pill:50px;
  --shadow:0 6px 20px rgba(0,0,0,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0b0b0d; --paper:#161618; --fog:#202024; --fog-2:#2c2c31; --accent:#3f9f7c; --accent-ink:#7fd1b0; --mist:#10291f; --lime:#3f9f7c; --forest:#000000; --spruce:#000000;
    --ink:#ffffff; --text:#d4d4d8; --muted:#a1a1aa; --faint:#71717a; --line:rgba(255,255,255,.10); --glow:0 0 0 1px rgba(255,255,255,.06),0 0 0 5px #0b0b0d;
    --red:#ff6b72; --red-soft:#3a1519; --amber:#f0b84a; --amber-soft:#33270f; --blue:#7fd1b0; --blue-soft:#10291f;
    --shadow:0 6px 20px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0b0b0d; --paper:#161618; --fog:#202024; --fog-2:#2c2c31; --accent:#3f9f7c; --accent-ink:#7fd1b0; --mist:#10291f; --lime:#3f9f7c; --forest:#000000; --spruce:#000000;
    --ink:#ffffff; --text:#d4d4d8; --muted:#a1a1aa; --faint:#71717a; --line:rgba(255,255,255,.10); --glow:0 0 0 1px rgba(255,255,255,.06),0 0 0 5px #0b0b0d;
    --red:#ff6b72; --red-soft:#3a1519; --amber:#f0b84a; --amber-soft:#33270f; --blue:#7fd1b0; --blue-soft:#10291f;
  --shadow:0 6px 20px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 120px}
.wrap.wide{max-width:1100px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:inherit}
.brand b{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.04em;color:var(--ink)}
.brand i{font-size:13px;color:var(--muted);white-space:nowrap}
.mebtn{border:0;background:none;padding:0;border-radius:50%;flex:none}
.mebtn .face{margin:0}
.faces{display:flex;align-items:center}
.face{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;border:2px solid var(--paper);margin-left:-8px}
.face:first-child{margin-left:0}
.face{object-fit:cover;flex:none}
.face.big{width:52px;height:52px;font-size:18px;margin:0;border:0}
.face.ghost{background:var(--fog);color:var(--faint);border:1.5px dashed var(--fog-2)}
.crew{margin-top:22px}
.crew-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.crew-row{display:flex;gap:16px;flex-wrap:wrap}
.crew-person{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px;max-width:84px;border:0;background:none;padding:0;text-align:center;font-size:13px;font-weight:600;color:var(--ink);position:relative}
.crew-person span:not(.face){overflow:hidden;text-overflow:ellipsis;max-width:84px}
.crew-person small{position:absolute;top:34px;right:6px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;white-space:nowrap}
.me-top{display:flex;align-items:center;gap:16px}
.me-pic .face{width:88px;height:88px;font-size:30px}
.me-links{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.face.sm{width:24px;height:24px;font-size:10px;margin-left:-6px;border-width:1.5px}

/* hero */
.hero{margin:22px 0 0}
.hero-title{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 14px}
.countpill{background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:7px 14px;border-radius:var(--r-pill);margin-bottom:6px;white-space:nowrap}
.countpill.live{background:#000;color:var(--lime)}
.stack-btn{border:0;background:none;padding:2px;border-radius:99px;margin-left:auto}
.stack-btn .face.sm{width:30px;height:30px;font-size:12px;margin-left:-9px;border-width:2px}
.stack-btn .face.sm:first-child{margin-left:0}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted)}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(46px,12.5vw,88px);line-height:.85;letter-spacing:-.05em;color:var(--ink);margin:0;text-transform:uppercase;text-wrap:balance}
.hero .sub{font-size:16px;color:var(--text);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:500;color:var(--ink)}

/* summary card */
.summary{background:#000;color:var(--on-forest);border-radius:28px;padding:24px;margin:24px 0 8px;display:grid;gap:18px}
.summary .big{font-family:var(--display);font-weight:900;font-size:44px;line-height:.9;letter-spacing:-.04em;color:var(--lime)}
.summary .big small{display:block;font-family:var(--body);font-weight:500;font-size:15px;letter-spacing:0;color:rgba(255,255,255,.8);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.08);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:rgba(255,255,255,.75)}
.stat.alert b{color:var(--lime)}
.money{font-size:14px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.money b{color:#fff;font-weight:600}

/* word tabs (Next / Past style) */
.tabs{display:flex;gap:clamp(10px,2.8vw,18px);overflow-x:auto;scrollbar-width:none;align-items:baseline;margin:18px 0 6px;position:sticky;top:0;background:var(--paper);padding:12px 0 10px;z-index:5;border-bottom:1px solid transparent}
.tabs.stuck{border-bottom-color:var(--line)}
.tab{background:none;border:0;padding:0;font-family:var(--display);font-weight:900;font-size:clamp(19px,5vw,40px);letter-spacing:-.045em;color:var(--faint);line-height:1;display:flex;align-items:flex-start;gap:4px;opacity:.9}
.tab[aria-selected="true"]{color:var(--ink)}
.tab sup{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted);margin-top:4px}
.tab[aria-selected="true"] sup{color:var(--ink)}
.tabhint{font-size:14px;color:var(--muted);margin:0 0 20px}

/* banner / notices */
.notice{background:var(--fog);border-radius:var(--r-card);padding:14px 16px;font-size:15px;margin:16px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* days */
.day{margin:0 0 36px}
.dayhead{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
.daynum{font-family:var(--display);font-weight:900;font-size:56px;line-height:.8;letter-spacing:-.05em;color:var(--ink);font-variant-numeric:tabular-nums}
.dayname{font-weight:700;color:var(--ink);font-size:17px;line-height:1.1}
.dayname span{display:block;font-weight:500;font-size:14px;color:var(--muted)}
.daytag{margin-left:auto;font-size:12px;font-weight:600;background:var(--mist);color:var(--accent-ink);padding:5px 10px;border-radius:var(--r-pill)}
:root[data-theme="dark"] .daytag{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .daytag{color:var(--lime)}}
.stack{display:grid;gap:10px}
.sleep{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;padding:2px 4px}

/* cards */
.card{background:var(--paper);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line);padding:16px;display:grid;grid-template-columns:44px 1fr auto;gap:12px 14px;align-items:start}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--fog)}
.tile svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile.flight{background:var(--blue-soft)} .tile.flight svg{stroke:var(--blue)}
.tile.stay{background:var(--mist)} .tile.stay svg{stroke:var(--spruce)}
.tile.taxi,.tile.car,.tile.parking{background:var(--amber-soft)} .tile.taxi svg,.tile.car svg,.tile.parking svg{stroke:var(--amber)}
.tile.idea{background:var(--red-soft)} .tile.idea svg{stroke:var(--red)}
.tile.food{background:var(--red-soft)} .tile.food svg{stroke:var(--red)}
:root[data-theme="dark"] .tile.stay svg{stroke:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile.stay svg{stroke:var(--lime)}}
.kicker{font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.kicker .time{color:var(--ink)}
.card h3{margin:2px 0 0;font-size:17px;line-height:1.3;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.details{margin:4px 0 0;font-size:15px;color:var(--text);white-space:pre-line;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.refbtn{background:var(--fog);border:0;border-radius:8px;padding:1px 8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--ink)}
.body-col{min-width:0}
.pills{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px}
.pill{border:0;border-radius:var(--r-pill);padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--mist);color:var(--accent-ink)}
.pill.todo{background:var(--red-soft);color:var(--red)}
.pill.unknown{background:var(--amber-soft);color:var(--amber)}
.pill.neutral{background:var(--fog);color:var(--text)}
:root[data-theme="dark"] .pill.ok{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.ok{color:var(--lime)}}
.pill[disabled]{cursor:default;opacity:.8}
.files{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.file{display:inline-flex;align-items:center;gap:6px;background:var(--fog);border-radius:var(--r-pill);padding:4px 12px 4px 4px;font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;max-width:100%;border:0}
.file img,.file .ph{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--fog-2);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--muted);flex:none}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.attach{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);padding:5px 12px;border-radius:var(--r-pill);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.attach input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.attach svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.iconbtn{background:var(--fog);border:0;border-radius:var(--r-pill);padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.addcard{border:1.5px dashed var(--fog-2);border-radius:var(--r-card);background:none;padding:14px;color:var(--muted);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.addcard:hover{border-color:var(--faint);color:var(--ink)}
.addcard b{font-size:20px;font-weight:500;line-height:1}


/* horizontal plan */
.hscroll{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 18px;margin:0 -20px;scroll-padding:0 20px;overscroll-behavior-x:contain}
.hscroll::-webkit-scrollbar{height:8px}
.hscroll::-webkit-scrollbar-thumb{background:var(--fog-2);border-radius:8px}
.hscroll .day{flex:1 0 250px;scroll-snap-align:start;margin:0;background:var(--fog);border-radius:24px;padding:16px 12px 12px;display:flex;flex-direction:column;min-width:0}
.hscroll .day.today{box-shadow:inset 0 0 0 2px var(--lime)}
.hscroll .dayhead{padding:0 4px}
.hscroll .card{grid-template-columns:36px 1fr;gap:8px 10px;padding:14px;position:relative}
.hscroll .card .edit{position:absolute;top:10px;right:10px;padding:5px 10px;font-size:12px}
.hscroll .card .kicker{padding-right:56px}
.hscroll .card > span:empty{display:none}
.hscroll .card .tile{width:36px;height:36px;border-radius:11px}
.hscroll .card .tile svg{width:19px;height:19px}
.hscroll .pills,.hscroll .files{grid-column:1/3}
.hscroll .card h3{font-size:16px}
.hscroll .details{font-size:14px}
.hscroll .addcard{background:var(--paper);border-color:transparent;margin-top:auto}
.hscroll .sleep{padding:0 4px}
.swipehint{font-size:13px;color:var(--muted);margin:-8px 0 10px;display:none}
@media (max-width:700px){.hscroll .day{flex-basis:84vw}}


/* penger */
.moneygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:0 0 28px}
.moneycard{background:var(--fog);border-radius:24px;padding:20px;display:grid;gap:6px}
.moneybig{font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:-.04em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.moneysub{font-size:15px;color:var(--text);margin-bottom:8px}
.moneysub b{color:var(--ink)}
.bar{height:8px;border-radius:8px;background:var(--fog-2);overflow:hidden;margin:4px 0 8px}
.bar span{display:block;height:100%;background:var(--lime);border-radius:8px}
.moneyrow{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.moneyrow b{color:var(--ink)}
.moneysection{margin:0 0 28px}
.moneysection h3{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--ink);margin:0 0 12px}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;box-shadow:0 0 0 1px var(--line);flex-wrap:wrap}
.payrow b{color:var(--ink)}
.payrow > :last-child{margin-left:auto}
.kindrow{display:flex;align-items:center;gap:12px}
.mapbox{height:min(72vh,600px);border-radius:24px;overflow:hidden;background:var(--fog);margin:0 0 14px;z-index:0;position:relative}
.mk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c-bg,#eef0ec);color:var(--c-ink,#0e0f0c);box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.3);cursor:pointer}
.mk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mk-allin{background:#000;color:#1e5a46}
.mk-home{background:#0e0f0c;color:#fff}
.mk-home-wrap{position:relative;display:grid;place-items:center;width:48px;height:48px}
.mk-home-wrap .mk-home{width:44px;height:44px;box-shadow:0 0 0 3px #1e5a46,0 4px 12px rgba(0,0,0,.35);position:relative}
.mk-home-wrap .mk-home svg{width:22px;height:22px}
.mk-pulse{position:absolute;inset:0;border-radius:50%;background:rgba(0,122,255,.35);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.leaflet-tooltip.home-label{background:#0e0f0c;color:#fff;border:0;border-radius:99px;font:700 12px/1 var(--body);padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.leaflet-tooltip.home-label::before{display:none}
.mapbox.placing{cursor:crosshair;box-shadow:0 0 0 3px var(--lime)}
.mapbox.placing .leaflet-container{cursor:crosshair}
.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 14px}
.maptools .pill{cursor:pointer}
.leaflet-container{font-family:var(--body)}
.boardbar{gap:8px}


/* steder (mapper) */
.folder-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px 0}
.folder-chip{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:var(--paper);box-shadow:0 0 0 1px var(--line);border-radius:50px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.folder-chip small{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.folder-chip[aria-pressed="true"]{background:#000;color:#fff;box-shadow:none}
.folder-chip[aria-pressed="true"] small{color:rgba(255,255,255,.7)}
.boardrow{display:flex;align-items:center;gap:8px;flex:1 1 100%}
.bar-add{margin-left:auto;padding:7px 12px;font-size:13px}
.folder-chip.add{background:none;box-shadow:inset 0 0 0 1.5px var(--fog-2);color:var(--muted)}
.pin-folder{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)!important}
/* bildenåler på kartet */
.pinb{position:relative;display:block;width:46px;height:54px;cursor:pointer;filter:drop-shadow(0 4px 8px rgba(0,0,0,.28))}
.pinb::after{content:"";position:absolute;left:50%;bottom:2px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:0 0 4px 0}
.pinb-face{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;background:var(--c-bg,#f0f0f2);color:var(--c-ink,#000);border:3px solid #fff;display:grid;place-items:center;overflow:hidden;z-index:1}
.pinb-face svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.leaflet-container .leaflet-marker-pane .pinb-face img{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none!important;object-fit:cover;z-index:1}
.pinb.has-img .pinb-face svg{opacity:0}
.pinb em{position:absolute;right:-4px;top:-4px;z-index:2;min-width:20px;height:20px;padding:0 5px;border-radius:50px;background:#000;color:#fff;font:700 11px/20px var(--body);font-style:normal;text-align:center;box-shadow:0 0 0 2px #fff}
.pinb em.heartbadge{background:var(--red)}
.pinb-home .pinb-face{background:#000;color:#fff;border-color:var(--accent)}
.pinb-home::after{background:var(--accent)}
.pinb-home .pinb-face svg{width:22px;height:22px;stroke-width:2.1}
.leaflet-marker-icon:hover .pinb{transform:translateY(-2px);transition:transform .15s}
/* samlet reisevei */
.travel{background:var(--paper);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line);padding:14px 14px 10px}
.tv-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:0 2px 10px}
.tv-head .muted{font-weight:600;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tv-row{display:grid;grid-template-columns:44px 34px 1fr;gap:10px;align-items:start;width:100%;border:0;background:none;padding:4px 2px;text-align:left;color:inherit;border-radius:14px;cursor:pointer}
.tv-row:active{background:var(--fog)}
.tv-time{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;padding-top:8px}
.tv-node.tile{width:34px;height:34px;border-radius:11px}
.tv-node.tile svg{width:18px;height:18px}
.tv-body{display:grid;gap:2px;min-width:0;padding-top:2px}
.tv-body b{font-size:15px;color:var(--ink);line-height:1.3}
.tv-body small{font-size:13px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tv-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.tv-meta .pill{padding:3px 9px;font-size:12px}
.tv-ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--fog);padding:2px 7px;border-radius:7px;color:var(--ink)}
.tv-att{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tv-att svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.tv-gap{display:grid;grid-template-columns:44px 34px 1fr;gap:10px;align-items:center;min-height:22px;padding:0 2px}
.tv-dash{grid-column:2;justify-self:center;width:0;height:100%;min-height:22px;border-left:2px dashed var(--fog-2)}
.tv-gaptext{grid-column:3;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.02em}
/* planlagte idéer i planen */
.card.planned,.hscroll .card.planned{overflow:hidden;grid-template-columns:1fr auto}
.card.planned .moveback,.card.planned .planned-img{grid-column:1 / -1}
.catdot{display:inline-flex;align-items:center;gap:6px}
.catdot::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--c-ink)}
.planned-img{margin:-14px -14px 4px;height:140px;background:var(--c-bg,var(--fog))}
.planned-img img{width:100%;height:100%;object-fit:cover;display:block}
.tile.idea svg{stroke:currentColor}
.moveback{margin-top:6px;border:0;border-top:1px solid var(--line);background:none;padding:12px 0 2px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;cursor:pointer;width:100%}
.moveback.armed{color:#fff;background:var(--red);border-radius:50px;border-top-color:transparent;padding:10px 14px;margin-top:10px}
/* forsiden */
.trips{display:grid;gap:14px;margin-top:8px}
@media (min-width:700px){.trips{grid-template-columns:repeat(2,1fr)}}
.tripcard{border:0;text-align:left;background:var(--fog);border-radius:28px;padding:20px;display:grid;gap:10px;color:var(--ink);cursor:pointer}
.tripcard.current{background:#000;color:#fff}
.tripcard.current .eyebrow,.tripcard.current .tripcard-foot{color:rgba(255,255,255,.75)}
.tripcard-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tripcard-top .countpill{margin:0;font-size:13px;padding:5px 12px}
.tripcard-title{font-family:var(--display);font-weight:900;font-size:clamp(36px,10vw,56px);line-height:.9;letter-spacing:-.05em;text-transform:uppercase;overflow-wrap:anywhere}
.tripcard-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--text);font-size:15px}
.tripcard:active{transform:scale(.99)}
.datechip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:18px;background:var(--paper);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.datechip.empty{padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.datechip .leaf{display:grid;place-items:center;min-width:44px;padding:5px 6px 4px;border-radius:12px;background:var(--fog);line-height:1}
.datechip .leaf b{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.datechip .leaf small{font-size:10px;font-weight:700;letter-spacing:.08em;margin-top:3px;color:var(--muted)}
.datechip .arrow{font-weight:700;opacity:.6}
.datechip .meta{display:grid;font-size:13px;font-weight:600;line-height:1.2;padding-left:4px}
.datechip .meta small{font-size:11px;font-weight:500;opacity:.7}
.tripcard.has-cover .datechip{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.tripcard.has-cover .datechip .leaf{background:#fff;color:#0e0f0c}
.tripcard.has-cover .datechip .meta,.tripcard.current .datechip .meta,.tripcard.has-cover .datechip .arrow{color:#fff;opacity:1}
.tripcard.has-cover .datechip .meta small{opacity:.8}
.tripcard.has-cover .datechip .leaf small{color:#cb272f}
.tripcard.current:not(.has-cover) .datechip{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
.tripcard.current:not(.has-cover) .datechip .leaf{background:#fff;color:#0e0f0c}
.tripcard{position:relative;overflow:hidden;isolation:isolate}
.tripcard-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.tripcard.has-cover{min-height:220px;align-content:space-between;color:#fff;background:#0e0f0c}
.tripcard.has-cover::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.65) 100%)}
.tripcard.has-cover .eyebrow,.tripcard.has-cover .tripcard-foot{color:#fff}
.tripcard.has-cover .tripcard-title{text-shadow:0 2px 16px rgba(0,0,0,.35)}
.tripcard.has-cover.current{box-shadow:0 0 0 3px var(--lime)}
.tripadd{min-height:120px;border-radius:28px;font-size:17px}


/* kart, moderne */
.tiles-mono{filter:grayscale(1) saturate(0) brightness(1.08) contrast(.88)}
.tiles-mono.dark{filter:grayscale(1) invert(1) brightness(.85) contrast(.9)}
.mapbox{background:#f2f2f2}
.mapwrap{position:relative;margin:0 0 14px}
.mapwrap .mapbox{margin:0;border-radius:28px;box-shadow:0 0 0 1px var(--line)}
.map-days{margin:0 0 10px}
.map-days button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.map-sheet{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;background:var(--paper);border-radius:20px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:grid;gap:2px;font-size:14px}
.map-sheet b{font-size:16px;color:var(--ink)}
.mk2{position:relative;width:22px;height:22px;border-radius:7px;background:#0e0f0c;display:grid;place-items:center;box-shadow:0 0 0 3px #fff,0 3px 10px rgba(0,0,0,.35);cursor:pointer}
.mk2 .mk2-dot{width:8px;height:8px;border-radius:2px;background:var(--c-bg,#fff)}
.mk2 em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font:800 11px/1 var(--body);color:#fff}
.mk2 em + .mk2-dot{display:none}
.mk2-allin{background:#000}
.mk2-allin .mk2-dot{background:#1e5a46}
.mk2-home{width:30px;height:30px;border-radius:9px;color:#fff;box-shadow:0 0 0 3px #1e5a46,0 3px 12px rgba(0,0,0,.4)}
.mk2-home svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.leaflet-tooltip.callout{background:transparent;border:0;box-shadow:none;padding:0;opacity:1!important}
.leaflet-tooltip.callout::before{display:none}
.mapbox:not(.show-labels) .leaflet-tooltip.callout:not(.callout-home){display:none}
.callout-in{display:flex;align-items:center;gap:8px;background:#fff;color:#0e0f0c;border-radius:10px;padding:6px 8px 6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.16);font:600 12px/1.25 var(--body);white-space:nowrap}
.callout-txt{display:block;flex:none}
.callout-txt b,.callout-txt small{display:block;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.callout-txt b{font-weight:700}
.callout-txt small{color:#6a6c6a;font-weight:500;font-size:11px}
.callout-in i{font-style:normal;font-size:18px;line-height:1;color:#9a9c99}
.callout-home .callout-in{background:#0e0f0c;color:#fff}
.callout-home .callout-in small{color:#cfd3cb}
.walk{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:#0e0f0c;color:#fff;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.walk b{font-size:14px;font-weight:800}
.walk small{font-size:8px;font-weight:700;letter-spacing:.06em}
.leaflet-control-zoom{border:0!important;box-shadow:0 4px 14px rgba(0,0,0,.15)!important;border-radius:14px!important;overflow:hidden;margin:12px 12px 0 0!important}
.leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;border:0!important;color:#0e0f0c!important;font-size:20px!important}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.7)!important;border-radius:8px 0 0 0}
.mapwrap:has(.map-sheet) .leaflet-bottom{bottom:84px}

/* hearts */
.hearts{display:flex;align-items:center;gap:8px}
.heart{border:0;background:var(--fog);border-radius:var(--r-pill);padding:6px 12px 6px 10px;display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--ink)}
.heart svg{width:16px;height:16px;stroke:var(--red);fill:none;stroke-width:2;stroke-linejoin:round}
.heart[aria-pressed="true"]{background:var(--red-soft);color:var(--red)}
.heart[aria-pressed="true"] svg{fill:var(--red)}

/* board */
.boardbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.seg{display:inline-flex;background:var(--fog);border-radius:var(--r-pill);padding:4px}
.seg button{border:0;background:none;border-radius:var(--r-pill);padding:7px 14px;font-size:14px;font-weight:500;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.drops{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.drop{border:1.5px dashed var(--fog-2);border-radius:var(--r-pill);padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);background:none}
.drop.over{border-color:var(--accent-ink);background:var(--mist);color:var(--accent-ink);border-style:solid}
.drops-label{font-size:13px;color:var(--muted);width:100%;margin:0 0 -2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.idea{background:var(--paper);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.idea[draggable="true"]{cursor:grab}
.idea.dragging{opacity:.5}
.idea .cat{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.idea h3{margin:0;font-size:18px;line-height:1.25;color:var(--ink);font-weight:700;letter-spacing:-.015em;overflow-wrap:anywhere}
.idea p{margin:0;font-size:14px;color:var(--text);overflow-wrap:anywhere}
.idea a.ext{font-size:14px;color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.idea .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.idea .by{font-size:12px;color:var(--faint)}
.idea.allin{background:#000;box-shadow:none;color:#e6f0de}
.idea.allin h3{color:#fff}
.idea.allin p,.idea.allin .cat,.idea.allin .by{color:rgba(255,255,255,.75)}
.idea.allin a.ext{color:var(--lime)}
.idea.allin .heart{background:rgba(255,255,255,.1);color:#fff}
.idea.allin .heart[aria-pressed="true"]{background:var(--accent);color:#fff}
.idea.allin .heart[aria-pressed="true"] svg{fill:#fff;stroke:#fff}
.idea.allin .iconbtn,.idea.allin select{background:rgba(255,255,255,.1);color:#fff}
.allin-badge{align-self:flex-start;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill)}
.idea.allin.flash{animation:glow 1.4s ease-out 1}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(0,122,255,.6)}100%{box-shadow:0 0 0 18px rgba(0,122,255,0)}}
.dayselect{border:0;background:var(--fog);border-radius:var(--r-pill);padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink);max-width:150px}
.planned-tag{font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--mist);padding:3px 9px;border-radius:var(--r-pill)}
.idea.allin .planned-tag{background:rgba(255,255,255,.12);color:var(--lime)}
.quickadd{display:flex;gap:8px;margin:0 0 16px}
.quickadd input{flex:1;min-width:0}

/* inputs & buttons */
.input,select.input,textarea.input{width:100%;border:0;background:var(--fog);border-radius:var(--r-input);padding:13px 14px;font-size:16px;color:var(--ink)}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn{border:0;border-radius:var(--r-pill);padding:12px 22px;font-weight:600;font-size:16px;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.btn.danger{background:none;color:var(--red);padding-left:0;padding-right:0;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.5;cursor:default}

/* sheets */
dialog.sheet{border:0;padding:0;background:var(--paper);color:var(--text);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:hidden;border-radius:28px 28px 0 0;margin:auto auto 0;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
dialog.sheet::backdrop{background:rgba(14,15,12,.45)}
@media (min-width:700px){dialog.sheet{border-radius:28px;margin:auto}}
dialog.sheet[open]{display:flex;flex-direction:column}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:3;min-height:64px;padding:10px 22px;background:var(--paper);border-radius:28px 28px 0 0}
.sheet-head .grab{margin:0}
.sheet-in{position:relative;z-index:1;padding:4px 22px calc(28px + env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain;flex:0 1 auto;min-height:0;max-height:none;-webkit-overflow-scrolling:touch}
.grab{width:40px;height:5px;border-radius:3px;background:var(--fog-2);margin:0 auto 14px}
.sheet h2{font-family:var(--display);font-weight:900;font-size:32px;letter-spacing:-.04em;line-height:1;color:var(--ink);margin:0 0 18px}
.close{position:absolute;top:10px;right:12px;z-index:4;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:24px;line-height:1;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2);touch-action:manipulation}
.close:active{transform:scale(.92)}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds button{border:0;background:var(--fog);border-radius:var(--r-pill);padding:8px 14px;font-size:14px;font-weight:500}
.kinds button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.lightbox img{display:block;max-width:100%;max-height:80vh;margin:0 auto;border-radius:12px}

/* onboarding */
.onboard{min-height:70vh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto}
.onboard h2{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;letter-spacing:-.04em;color:var(--ink);margin:0 0 22px}
.onboard .btn{width:100%;margin-top:12px}
.onboard p{color:var(--muted);font-size:15px}

/* papers */
.paper-group{margin:0 0 24px}
.paper-group h3{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.thumb{border:0;background:var(--fog);border-radius:14px;overflow:hidden;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:var(--ink);padding:0;text-align:left;position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .lbl{position:relative;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:12px;font-weight:600;padding:20px 10px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb .pdf{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:28px;color:var(--muted)}
.empty{background:var(--fog);border-radius:var(--r-card);padding:28px 22px;text-align:left}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:18px}
.empty p{margin:0;color:var(--text);font-size:15px;max-width:52ch}


@media (hover:none){.drops{display:none}}
/* pinterest board */
.masonry{column-width:200px;column-gap:14px}
@media (max-width:520px){.masonry{column-count:2;column-width:auto;column-gap:10px}}
.pin{break-inside:avoid;margin:0 0 16px;display:block;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit}
.pin[draggable="true"]{cursor:grab}
.pin.dragging{opacity:.45}
.pin .ph{position:relative;border-radius:20px;overflow:hidden;background:var(--fog);display:block}
.pin .ph img{display:block;width:100%;height:auto}
.pin .art{display:flex;flex-direction:column;justify-content:space-between;padding:16px;color:var(--c-ink)}
.pin .art svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.pin .art b{font-family:var(--display);font-weight:900;font-size:26px;line-height:.95;letter-spacing:-.04em;overflow-wrap:anywhere}
.pin .tag{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:var(--r-pill);background:var(--c-bg);color:var(--c-ink)}
.pin .allin{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:var(--r-pill);background:var(--accent);color:#fff}
.pin{cursor:pointer}
.pin:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:20px}
.pin .heartcount{border:0;cursor:pointer;position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:8px 12px;min-height:36px;border-radius:var(--r-pill);background:rgba(255,255,255,.92);color:#0e0f0c}
.pin .heartcount:active{transform:scale(.94)}
.pin .heartcount svg{width:15px;height:15px;stroke:#cb272f;fill:none;stroke-width:2}
.pin .heartcount.mine svg{fill:#cb272f}
.pin.flash .ph{animation:glow 1.4s ease-out 1}
.pin .cap{padding:8px 4px 0;display:grid;gap:2px}
.pin .cap h3{margin:0;font-size:15px;line-height:1.3;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.pin .cap span{font-size:12px;color:var(--muted)}
.cat-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:var(--r-pill);background:var(--c-bg);color:var(--c-ink)}
.detail-hero{border-radius:22px;overflow:hidden;margin:0 0 16px;background:var(--fog)}
.detail-hero img{display:block;width:100%;max-height:52vh;object-fit:cover}
.detail-hero .art{min-height:160px;padding:20px;display:flex;align-items:flex-end;color:var(--c-ink)}
.detail-hero .art svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.daychips{display:flex;flex-wrap:wrap;gap:8px}
.daychips button{border:0;background:var(--fog);border-radius:var(--r-pill);padding:10px 16px;font-size:15px;font-weight:600;color:var(--ink)}
.daychips button[aria-pressed="true"]{background:var(--accent);color:#fff}
.section-label{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-pick img{width:56px;height:56px;border-radius:14px;object-fit:cover}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:var(--r-pill);font-size:14px;font-weight:500;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
